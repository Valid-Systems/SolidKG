name: Release

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.metadata.outputs.release_sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org
      - run: corepack enable pnpm
      - name: Sync package-lock.json if version drifted
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          lock_version=$(node -p "require('./package-lock.json').version")
          if [ "$package_version" != "$lock_version" ]; then
            npm install --package-lock-only --ignore-scripts
            test "$(node -p "require('./package-lock.json').version")" = "$package_version"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "release: sync package-lock.json to ${package_version}" -m "[skip ci] Auto-generated by Release workflow."
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi
      - name: Resolve immutable release metadata
        id: metadata
        run: |
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Verify source before release
        run: |
          pnpm exec tsc --noEmit
          pnpm test
          pnpm run build

  bundle:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            arch: arm64
          - target: darwin-x64
            runner: macos-15-intel
            arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - target: linux-x64
            runner: ubuntu-24.04
            arch: x64
          - target: win32-arm64
            runner: windows-11-arm
            arch: arm64
          - target: win32-x64
            runner: windows-2025
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          architecture: ${{ matrix.arch }}
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert native build target
        shell: bash
        run: test "$(node -p "process.platform + '-' + process.arch")" = "${{ matrix.target }}"
      - name: Build and smoke-test bundle
        shell: bash
        run: bash scripts/build-bundle.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.target }}
          path: release/solidkg-${{ matrix.target }}.*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [prepare, bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: release
          merge-multiple: true
      - name: Validate complete bundle set
        run: |
          set -euo pipefail
          expected=(
            solidkg-darwin-arm64.tar.gz
            solidkg-darwin-x64.tar.gz
            solidkg-linux-arm64.tar.gz
            solidkg-linux-x64.tar.gz
            solidkg-win32-arm64.zip
            solidkg-win32-x64.zip
          )
          test "$(find release -maxdepth 1 -type f -name 'solidkg-*' | wc -l)" -eq "${#expected[@]}"
          for archive in "${expected[@]}"; do
            test -s "release/$archive"
          done
      - name: Generate SHA256SUMS
        run: |
          (cd release && sha256sum solidkg-* > SHA256SUMS)
          cat release/SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ needs.prepare.outputs.version }}"
          release_sha="${{ needs.prepare.outputs.release_sha }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$release_sha"
            gh release upload "$tag" release/solidkg-* release/SHA256SUMS --clobber
          else
            gh release create "$tag" release/solidkg-* release/SHA256SUMS --target "$release_sha" --title "$tag" --generate-notes
          fi
      - name: Pack npm packages
        run: bash scripts/pack-npm.sh "${{ needs.prepare.outputs.version }}"
      - name: Package smoke
        run: |
          tgz=$(npm pack ./release/npm/main --pack-destination /tmp --silent)
          tmp=$(mktemp -d)
          npm install --omit=optional --ignore-scripts --no-audit --no-fund --prefix "$tmp" "/tmp/$tgz"
          node -e "const fs=require('fs'); const path=require('path'); const dir='$tmp/node_modules/solidkg'; const pkg=require(path.join(dir,'package.json')); if (pkg.version !== '${{ needs.prepare.outputs.version }}') throw new Error('wrong package version'); if (pkg.license !== 'MIT') throw new Error('wrong package license'); if (!fs.existsSync(path.join(dir,'LICENSE'))) throw new Error('missing LICENSE'); if (!pkg.bin || !pkg.bin.solidkg) throw new Error('missing bin'); if (!pkg.optionalDependencies || Object.keys(pkg.optionalDependencies).length !== 6) throw new Error('wrong platform dependency count');"
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          for dir in release/npm/solidkg-* release/npm/main; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
            else
              (cd "$dir" && npm publish --access public)
            fi
          done
      - name: Verify every package on the registry
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          for dir in release/npm/solidkg-* release/npm/main; do
            name=$(node -p "require('./$dir/package.json').name")
            published=
            for attempt in 1 2 3 4 5 6; do
              if npm view "$name@$version" version >/dev/null 2>&1; then
                published=1
                break
              fi
              sleep 10
            done
            test -n "$published"
          done
      - name: Sync packages to npmmirror
        continue-on-error: true
        run: |
          for dir in release/npm/solidkg-* release/npm/main; do
            name=$(node -p "require('./$dir/package.json').name")
            encoded=$(node -p "encodeURIComponent(require('./$dir/package.json').name)")
            curl -s -X PUT "https://registry.npmmirror.com/-/package/$encoded/syncs" || true
            echo "sync requested for $name"
          done
